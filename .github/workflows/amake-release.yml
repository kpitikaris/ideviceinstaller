name: amake-release-build

# Tag-triggered build that produces flat-layout ideviceinstaller bundles for
# Windows / Linux / macOS, sha256-summed and attached to a GitHub Release.
# Consumed by AMake's managed-tools fetcher; the produced asset names are
# referenced verbatim from AMake's src/AMake.Platform/Tools/tools.json.
#
# Approach: mirror upstream's own build.yml — fetch prebuilt libplist /
# libimobiledevice-glue / libusbmuxd / libimobiledevice artifacts from the
# respective libimobiledevice/<repo>'s CI, extract into the right prefix,
# build only ideviceinstaller here, then repackage into a flat dist/.
#
# Why not build deps from source: libimobiledevice 1.4.0 needs libtatsu,
# and the MinGW dllimport ABI for static libs is fragile — upstream's
# per-repo CIs already handle both correctly, so we piggy-back.
#
# Trigger:
#   git tag amake-1.2.0 && git push origin amake-1.2.0
#
# Or via the GitHub UI: Actions → amake-release-build → Run workflow.
# (workflow_dispatch builds the bundles but skips the release-create step;
# only tag pushes produce a public release page.)

on:
  push:
    tags:
      - 'amake-*'
  workflow_dispatch:

permissions:
  contents: write   # needed for the release-create step in the final job

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # Linux x86_64 — must match upstream's libplist build runner (currently
  # ubuntu-latest / 24.04). Older runners trip a glibc ABI mismatch:
  # upstream's libplist.so references __isoc23_strtoull@GLIBC_2.38, which
  # only exists from glibc 2.38 onward. Consequence for AMake users: the
  # bundle requires glibc >= 2.38 (Ubuntu 24.04+, Debian 13+, Fedora 39+).
  # ──────────────────────────────────────────────────────────────────────
  build-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - name: install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake libtool pkg-config \
            libssl-dev libzip-dev zlib1g-dev

      - name: prepare environment
        run: echo "target_triplet=$(gcc -dumpmachine)" >> "$GITHUB_ENV"

      - name: fetch libplist
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: build.yml
          name: libplist-latest_${{ env.target_triplet }}
          repo: libimobiledevice/libplist

      - name: fetch libimobiledevice-glue
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: build.yml
          name: libimobiledevice-glue-latest_${{ env.target_triplet }}
          repo: libimobiledevice/libimobiledevice-glue

      - name: fetch libusbmuxd
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: build.yml
          name: libusbmuxd-latest_${{ env.target_triplet }}
          repo: libimobiledevice/libusbmuxd

      - name: fetch libimobiledevice
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: build.yml
          name: libimobiledevice-latest_${{ env.target_triplet }}
          repo: libimobiledevice/libimobiledevice

      - name: install fetched deps into /
        run: |
          mkdir extract
          for I in *.tar; do
            tar -C extract -xvf "$I"
          done
          sudo cp -r extract/* /
          sudo ldconfig

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: build ideviceinstaller (this fork)
        run: |
          ./autogen.sh PKG_CONFIG_PATH=/usr/local/lib/pkgconfig
          make -j"$(nproc)"
          sudo make install

      - name: stage flat-layout bundle
        run: |
          mkdir -p dist
          cp src/ideviceinstaller dist/
          cp /usr/local/bin/idevice_id dist/ || true
          # ideviceinstaller links shared against the libimobiledevice stack —
          # copy the .so deps so the bundle is self-contained.
          for so in libplist-2.0 libimobiledevice-glue-1.0 libusbmuxd-2.0 libimobiledevice-1.0 libtatsu-1.0; do
            cp /usr/local/lib/${so}.so* dist/ 2>/dev/null || true
          done
          strip dist/ideviceinstaller dist/idevice_id 2>/dev/null || true
          # Smoke-check: must run and report something (the bundled .sos must
          # be picked up via $ORIGIN/lib search, hence LD_LIBRARY_PATH=dist).
          LD_LIBRARY_PATH=dist ./dist/ideviceinstaller --help > /dev/null
          tar -czf libimobiledevice-bundle-linux-x64.tar.gz -C dist .
          ls -la libimobiledevice-bundle-linux-x64.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: libimobiledevice-bundle-linux-x64
          path: libimobiledevice-bundle-linux-x64.tar.gz
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────
  # macOS arm64 — Apple Silicon. Upstream's macOS artifacts are universal
  # (arm64 + x86_64), but we just take the arm64 slice for AMake's osx-arm64
  # RID. macOS x64 (osx-x64) is past Apple's support window, skipped.
  # ──────────────────────────────────────────────────────────────────────
  build-macos-arm64:
    runs-on: macos-14
    steps:
      - name: install build deps (Homebrew)
        run: brew install autoconf automake libtool pkg-config openssl@3 libzip

      - name: fetch libplist
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: build.yml
          name: libplist-latest_macOS
          repo: libimobiledevice/libplist

      - name: fetch libimobiledevice-glue
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: build.yml
          name: libimobiledevice-glue-latest_macOS
          repo: libimobiledevice/libimobiledevice-glue

      - name: fetch libusbmuxd
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: build.yml
          name: libusbmuxd-latest_macOS
          repo: libimobiledevice/libusbmuxd

      - name: fetch libimobiledevice
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: build.yml
          name: libimobiledevice-latest_macOS
          repo: libimobiledevice/libimobiledevice

      - name: install fetched deps into /
        run: |
          mkdir extract
          for I in *.tar; do
            tar -C extract -xvf "$I"
          done
          sudo cp -r extract/* /

      - uses: actions/checkout@v4

      - name: build ideviceinstaller (this fork)
        run: |
          export PKG_CONFIG_PATH="/usr/local/lib/pkgconfig:$(brew --prefix openssl@3)/lib/pkgconfig:$(brew --prefix libzip)/lib/pkgconfig"
          ./autogen.sh PKG_CONFIG_PATH="$PKG_CONFIG_PATH"
          make -j"$(sysctl -n hw.ncpu)"
          sudo make install

      - name: stage flat-layout bundle
        run: |
          mkdir -p dist
          cp src/ideviceinstaller dist/
          cp /usr/local/bin/idevice_id dist/ || true
          # macOS dylibs from upstream's artifacts:
          for dylib in libplist-2.0 libimobiledevice-glue-1.0 libusbmuxd-2.0 libimobiledevice-1.0 libtatsu-1.0; do
            cp /usr/local/lib/${dylib}.*.dylib dist/ 2>/dev/null || true
            cp /usr/local/lib/${dylib}.dylib   dist/ 2>/dev/null || true
          done
          # Rewrite install names so the bundled dylibs resolve via @loader_path
          # — that lets users drop the bundle anywhere without DYLD games.
          for f in dist/ideviceinstaller dist/idevice_id; do
            [ -f "$f" ] || continue
            for dep_path in $(otool -L "$f" | awk 'NR>1 {print $1}' | grep '/usr/local/lib/'); do
              dep_base=$(basename "$dep_path")
              install_name_tool -change "$dep_path" "@loader_path/$dep_base" "$f" || true
            done
          done
          for f in dist/*.dylib; do
            [ -f "$f" ] || continue
            install_name_tool -id "@loader_path/$(basename "$f")" "$f" || true
            for dep_path in $(otool -L "$f" | awk 'NR>1 {print $1}' | grep '/usr/local/lib/'); do
              dep_base=$(basename "$dep_path")
              install_name_tool -change "$dep_path" "@loader_path/$dep_base" "$f" || true
            done
          done
          ./dist/ideviceinstaller --help > /dev/null
          tar -czf libimobiledevice-bundle-osx-arm64.tar.gz -C dist .
          ls -la libimobiledevice-bundle-osx-arm64.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: libimobiledevice-bundle-osx-arm64
          path: libimobiledevice-bundle-osx-arm64.tar.gz
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────
  # Windows x64 — MSYS2 / MINGW64. Pulls upstream's prebuilt MINGW64
  # artifacts; each contains mingw64/{include,lib,bin}. Result is
  # ideviceinstaller.exe + idevice_id.exe + bundled runtime DLLs.
  # ──────────────────────────────────────────────────────────────────────
  build-windows-x64:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: install MSYS2 + MINGW64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          release: false
          update: false
          install: >-
            base-devel
            git
            zip
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-libzip
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-xz
            mingw-w64-x86_64-bzip2
            autoconf
            automake-wrapper
            libtool

      - name: prepare environment
        run: |
          dest=mingw64
          echo "dest=$dest" >> "$GITHUB_ENV"
          echo "target_triplet=$(gcc -dumpmachine)" >> "$GITHUB_ENV"

      - name: fetch libplist
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: build.yml
          name: libplist-latest_x86_64-${{ env.dest }}
          repo: libimobiledevice/libplist

      - name: fetch libimobiledevice-glue
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: build.yml
          name: libimobiledevice-glue-latest_x86_64-${{ env.dest }}
          repo: libimobiledevice/libimobiledevice-glue

      - name: fetch libusbmuxd
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: build.yml
          name: libusbmuxd-latest_x86_64-${{ env.dest }}
          repo: libimobiledevice/libusbmuxd

      - name: fetch libimobiledevice
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: build.yml
          name: libimobiledevice-latest_x86_64-${{ env.dest }}
          repo: libimobiledevice/libimobiledevice

      - name: install fetched deps into MSYS2 root
        run: |
          mkdir extract
          for I in *.tar; do
            tar -C extract -xvf "$I"
          done
          cp -r extract/* /

      - uses: actions/checkout@v4

      - name: build ideviceinstaller (this fork)
        run: |
          ./autogen.sh PKG_CONFIG_PATH=/${{ env.dest }}/lib/pkgconfig
          make -j"$(nproc)"
          make install

      - name: stage flat-layout bundle with DLL deps
        run: |
          mkdir -p dist
          # Use the installed binaries (real PE files) instead of src/ — the
          # libtool wrapper at src/ideviceinstaller.exe is a shell script on
          # MinGW and trips `ldd` later (which then aborts the script under
          # `set -e -o pipefail`).
          cp /${{ env.dest }}/bin/ideviceinstaller.exe dist/
          cp /${{ env.dest }}/bin/idevice_id.exe dist/

          # Walk DLL closure. `ldd` can fail on individual files (libtool
          # wrappers, .lai files, anything that's not a PE) — tolerate per-
          # file errors so one bad input doesn't kill the whole step.
          walk() {
            ldd "$1" 2>/dev/null \
              | awk '$3 ~ /\/mingw64\// {print $3}' \
              | sort -u \
              | while read -r dll; do
                  cp -n "$dll" dist/
                done || true
          }
          for exe in dist/*.exe; do walk "$exe"; done
          # Recursive closure — bundled DLLs themselves may pull in more
          # /mingw64/ DLLs. Iterate until no new files appear.
          while :; do
            before=$(ls dist/ | wc -l)
            for dll in dist/*.dll; do walk "$dll"; done
            after=$(ls dist/ | wc -l)
            [ "$before" = "$after" ] && break
          done

          # Smoke-check from inside dist/ so DLL resolution exercises the
          # bundled copies, not whatever MSYS2 left in PATH.
          (cd dist && ./ideviceinstaller.exe --help > /dev/null)
          (cd dist && zip -r ../libimobiledevice-bundle-win-x64.zip .)
          ls -la libimobiledevice-bundle-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: libimobiledevice-bundle-win-x64
          path: libimobiledevice-bundle-win-x64.zip
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────
  # Release — only fires on tag push. Pulls every per-platform artifact,
  # computes SHA256SUMS.txt, creates the GitHub Release with everything
  # attached. workflow_dispatch runs the three builds but skips this job.
  # ──────────────────────────────────────────────────────────────────────
  release:
    needs: [build-linux-x64, build-macos-arm64, build-windows-x64]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true   # flatten one-file-per-artifact-dir into ./artifacts/

      - name: compute SHA256SUMS.txt
        run: |
          cd artifacts
          ls -la
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$tag" \
            --notes "AMake-bundled libimobiledevice + ideviceinstaller.

          Deps fetched from each libimobiledevice/<repo>'s latest build.yml
          artifact (libplist, libimobiledevice-glue, libusbmuxd,
          libimobiledevice — itself transitively including libtatsu).

          See SHA256SUMS.txt for asset hashes." \
            artifacts/*
